services:
  web:
    build: .
    container_name: weather-flask-app
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    container_name: weather-nginx-proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
